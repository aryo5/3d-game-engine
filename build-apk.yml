name: Build Release APK ARM64

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version Code (optional, auto-increment if empty)'
        required: false
        type: string
      version_name:
        description: 'Version Name (e.g., 1.0.1)'
        required: false
        type: string

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK (ARM64 only with R8)
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="${{ github.run_number }}.0"
          
          if [ ! -z "${{ inputs.version_code }}" ]; then
            VERSION_CODE="${{ inputs.version_code }}"
          fi
          
          if [ ! -z "${{ inputs.version_name }}" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
          fi
          
          echo "📦 Building Release APK"
          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"
          
          ./gradlew clean :app:assembleRelease \
            -PversionCode=$VERSION_CODE \
            -PversionName=$VERSION_NAME \
            --no-daemon \
            --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:+UseG1GC"

      - name: Find and verify APK
        id: find-apk
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE_BYTES=$(stat -c%s "$APK_PATH")
            SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
            echo "✅ APK found: $SIZE_MB MB"
            ls -lh "$APK_PATH"
          else
            echo "❌ APK not found at $APK_PATH"
            ls -la app/build/outputs/
            exit 1
          fi

      - name: Rename APK with timestamp
        id: rename-apk
        run: |
          SOURCE="${{ steps.find-apk.outputs.apk_path }}"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SIZE="${{ steps.find-apk.outputs.apk_size_mb }}"
          DEST="Apex3D-Release-arm64-${TIMESTAMP}-${SIZE}MB.apk"
          cp "$SOURCE" "$DEST"
          echo "apk_file=$DEST" >> $GITHUB_OUTPUT
          echo "✅ Renamed: $DEST"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apex3D-Release-APK
          path: ${{ steps.rename-apk.outputs.apk_file }}
          retention-days: 30
          if-no-files-found: error

      - name: Generate Build Report
        run: |
          cat > BUILD_REPORT.txt << 'EOF'
          ╔════════════════════════════════════════════════════════════╗
          ║          🎮 APEX3D RELEASE BUILD COMPLETED                 ║
          ╚════════════════════════════════════════════════════════════╝
          
          📱 BUILD INFORMATION:
            • Target Architecture: ARM64 (arm64-v8a)
            • Build Type: Release
            • Debug Mode: Disabled ❌
            • Debuggable: False
            • Version: ${{ inputs.version_name || github.run_number }}
            
          🔧 OPTIMIZATIONS APPLIED:
            ✅ R8 Code Shrinking: ENABLED
            ✅ Resource Shrinking: ENABLED
            ✅ ProGuard: OPTIMIZED
            ✅ Debug Symbols: REMOVED
            ✅ Line Numbers: STRIPPED
            ✅ Unused Code: ELIMINATED
            
          📊 APK DETAILS:
            • File: ${{ steps.rename-apk.outputs.apk_file }}
            • Size: ${{ steps.find-apk.outputs.apk_size_mb }} MB
            • Format: APK (Single architecture)
            • Status: ✅ READY FOR INSTALLATION
            
           📥 INSTALLATION ON NON-ROOT DEVICE:
            1. Download APK from Actions > Artifacts
            2. Transfer to Android device
            3. Open file manager → tap APK
            4. Allow "Install from unknown sources" if prompted
            5. Tap "Install"
            6. Launch app
            
          🔄 UPDATE EXISTING APK:
            • Simply install the new APK over the old one
            • App data preserved in internal storage
            • No uninstall required
            • Using adb: adb install -r <apk-file>
            
           🛠️ BUILD ENVIRONMENT:
            • Java: 17 (Temurin)
            • Gradle: Latest
            • Android Gradle Plugin: Latest
            • Kotlin: Latest
            • NDK: Configured for native support
            
          ⚠️ IMPORTANT:
            • APK is for testing on non-root devices only
            • Signing is disabled for development
            • For production, configure signing keys in secrets
            • Monitor App size - if exceeds 100MB, review dependencies
            
          Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          cat BUILD_REPORT.txt

      - name: Upload Build Report
        uses: actions/upload-artifact@v4
        with:
          name: Build-Report
          path: BUILD_REPORT.txt
          retention-days: 30

      - name: Print Summary to Console
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                    ✅ BUILD SUCCESS                        ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📦 APK Generated: ${{ steps.rename-apk.outputs.apk_file }}"
          echo "💾 Size: ${{ steps.find-apk.outputs.apk_size_mb }} MB"
          echo ""
          echo "📥 Download from:"
          echo "   Actions → Latest Run → Artifacts → Apex3D-Release-APK"
          echo ""
          echo "📱 Install on device:"
          echo "   adb install -r ${{ steps.rename-apk.outputs.apk_file }}"
          echo ""
          echo "════════════════════════════════════════════════════════════"
