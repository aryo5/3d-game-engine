name: Build Android Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.1.0)'
        required: false
        default: '1.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-read-only: false
          add-job-summary: 'on-failure'

      - name: Setup Persistent Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Menggunakan Custom Release Keystore dari GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "DEFAULT_KEY_ALIAS=upload" >> $GITHUB_ENV
          elif [ -f my-upload-key.jks.base64 ]; then
            echo "Mengekstrak Keystore dari my-upload-key.jks.base64..."
            base64 --decode my-upload-key.jks.base64 > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "DEFAULT_KEY_ALIAS=upload" >> $GITHUB_ENV
          elif [ -f my-upload-key.jks ]; then
            echo "Menggunakan my-upload-key.jks yang sudah ada..."
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "DEFAULT_KEY_ALIAS=upload" >> $GITHUB_ENV
          elif [ -f debug.keystore.base64 ]; then
            echo "Mengekstrak Keystore dari debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore" >> $GITHUB_ENV
            echo "DEFAULT_KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
          elif [ -f debug.keystore ]; then
            echo "Menggunakan debug.keystore yang sudah ada..."
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore" >> $GITHUB_ENV
            echo "DEFAULT_KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
          else
            echo "Membuat upload keystore baru..."
            keytool -genkeypair -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Apex3D Engine, OU=GameEngine, O=Apex3D, L=Jakarta, ST=DKI, C=ID"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "DEFAULT_KEY_ALIAS=upload" >> $GITHUB_ENV
          fi

      - name: Setup Environment Config (.env)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f .env ]; then
            echo "GEMINI_API_KEY=${GEMINI_API_KEY:-placeholder}" > .env
          fi
          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=placeholder" > .env.example
          fi

      - name: Calculate Versioning
        id: versioning
        run: |
          # Hitung versionCode yang selalu naik agar Android mengizinkan instalasi timpa (in-place update)
          BASE_OFFSET=1000
          RUN_NUM=${{ github.run_number }}
          AUTO_VERSION_CODE=$((BASE_OFFSET + RUN_NUM))
          
          # Tentukan versionName
          INPUT_VN="${{ github.event.inputs.version_name }}"
          if [ -n "$INPUT_VN" ]; then
            AUTO_VERSION_NAME="$INPUT_VN"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            AUTO_VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            AUTO_VERSION_NAME="1.0.${RUN_NUM}"
          fi
          
          echo "version_code=$AUTO_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$AUTO_VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Generated Version Code: $AUTO_VERSION_CODE"
          echo "Generated Version Name: $AUTO_VERSION_NAME"

      - name: Assemble Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || env.DEFAULT_KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
        run: |
          gradle :app:assembleRelease \
            -PversionCode=${{ steps.versioning.outputs.version_code }} \
            -PversionName=${{ steps.versioning.outputs.version_name }} \
            -Dorg.gradle.vfs.watch=false \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dkotlin.incremental=false \
            --build-cache \
            --parallel \
            -x test \
            -x lint \
            -x lintVitalRelease \
            --stacktrace

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex3d-engine-release-v${{ steps.versioning.outputs.version_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
