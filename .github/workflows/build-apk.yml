name: Build Release APK ARM64

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version Code'
        required: false
        type: string
      version_name:
        description: 'Version Name'
        required: false
        type: string

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK (Release & Assemble)
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"
          
          if [ ! -z "${{ inputs.version_code }}" ]; then
            VERSION_CODE="${{ inputs.version_code }}"
          fi
          if [ ! -z "${{ inputs.version_name }}" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
          fi
          
          echo "📦 Memulai kompilasi APK (Version Code: $VERSION_CODE, Name: $VERSION_NAME)"
          ./gradlew assembleRelease \
            -PversionCode=$VERSION_CODE \
            -PversionName=$VERSION_NAME \
            --no-daemon \
            --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:+UseG1GC"

      - name: Find and verify APK
        id: find-apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            SIZE_BYTES=$(stat -c%s "$APK_PATH")
            SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
            DEST="Apex3D-GodotLua-$(date +%Y%m%d_%H%M%S).apk"
            cp "$APK_PATH" "$DEST"
            echo "apk_file=$DEST" >> $GITHUB_OUTPUT
            echo "✅ APK Berhasil dibuat: $DEST ($SIZE_MB MB)"
            ls -lh "$DEST"
          else
            echo "❌ APK tidak ditemukan di app/build/outputs/apk!"
            find app/build/outputs/ || true
            exit 1
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apex3D-Release-APK
          path: ${{ steps.find-apk.outputs.apk_file }}
          retention-days: 30
