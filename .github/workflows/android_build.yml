name: Build Android Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Siapkan Keystore Otomatis
        run: |
          keytool -genkeypair -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Apex3D Engine, OU=GameEngine, O=Apex3D, L=Jakarta, ST=DKI, C=ID"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          echo "DEFAULT_KEY_ALIAS=upload" >> $GITHUB_ENV

      - name: Siapkan File Environment
        run: |
          echo "GEMINI_API_KEY=placeholder" > .env
          echo "GEMINI_API_KEY=placeholder" > .env.example

      - name: Kompilasi Release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          STORE_PASSWORD: android
          KEY_ALIAS: upload
          KEY_PASSWORD: android

      - name: Unggah APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apex3D-Release-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
